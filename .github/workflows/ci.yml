name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install official Qloo harness
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Qloo runtime
        run: npm run verify:qloo
      - name: Syntax check
        run: |
          find api src test public -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check dev-server.js
      - name: Test
        run: npm test
      - name: Submission static preflight
        run: npm run submission:check
